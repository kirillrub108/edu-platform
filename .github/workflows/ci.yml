name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for ruff config
        id: ruff_cfg
        run: |
          if [ -f backend/ruff.toml ] || grep -q '\[tool.ruff\]' backend/pyproject.toml; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Python
        if: steps.ruff_cfg.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        if: steps.ruff_cfg.outputs.present == 'true'
        run: pip install ruff
      - name: ruff check + format
        if: steps.ruff_cfg.outputs.present == 'true'
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .
      - name: Skip notice
        if: steps.ruff_cfg.outputs.present != 'true'
        run: echo "ruff not configured in backend/pyproject.toml — skipping"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend test deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests (unit + integration, excluding slow)
        working-directory: backend
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          pytest -m "not slow" \
            --cov=app \
            --cov-report=xml \
            --cov-report=term \
            --cov-fail-under=70
      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: backend/coverage.xml
          if-no-files-found: ignore

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: []  # TEMP: gate disabled to verify deploy job in isolation, see revert commit below
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: edllm-deploy
      cancel-in-progress: false
    steps:
      - name: Install SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Pull + run deploy.sh on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd ~/edllm && git pull --ff-only && chmod +x deploy/deploy.sh && bash deploy/deploy.sh ${SHORT_SHA}"

      - name: External smoke-test (from GitHub runner)
        run: |
          for i in $(seq 1 12); do
            if curl -fsS https://edllm.ru/health >/dev/null && curl -fsS -o /dev/null https://edllm.ru/docs; then
              echo "external smoke-test OK"
              exit 0
            fi
            echo "attempt $i/12: not ready yet, retrying in 10s..."
            sleep 10
          done
          echo "external smoke-test failed — server-side rollback may have already run, check server logs"
          exit 1
