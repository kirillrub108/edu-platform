<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Edllm — технические работы</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; background: #f5f3ff; color: #1f2937;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .card {
    max-width: 520px; width: 100%; background: #fff; border: 1px solid #ede9fe;
    border-radius: 20px; padding: 40px 32px; text-align: center;
    box-shadow: 0 12px 40px rgba(76, 29, 149, .08);
  }
  .badge {
    display: inline-flex; align-items: center; gap: 8px; margin-bottom: 20px;
    padding: 6px 14px; border-radius: 999px; background: #f5f3ff; color: #6d28d9;
    font-size: 13px; font-weight: 600;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #7c3aed; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .25 } }
  h1 { margin: 0 0 12px; font-size: 24px; line-height: 1.3; }
  p { margin: 0 0 8px; font-size: 15px; line-height: 1.6; color: #4b5563; }
  .muted { margin-top: 24px; font-size: 13px; color: #9ca3af; }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none } }
</style>
</head>
<body>
  <main class="card">
    <div class="badge"><span class="dot"></span>Технические работы</div>
    <h1>Скоро вернёмся</h1>
    <p>Мы обновляем платформу. Это займёт несколько минут — данные и курсы в безопасности.</p>
    <p>Страница обновится сама, как только всё заработает.</p>
    <p class="muted">Если ожидание затянулось, напишите нам — мы на связи.</p>
  </main>
  <script>setTimeout(function () { location.reload(); }, 30000);</script>
</body>
</html>
