# ACTIVE WEB SLOT — rewritten by deploy/deploy.sh, applied with `nginx -s reload`.
#
# Included from nginx/prod.conf.template at http level. It names EXACTLY ONE
# slot per tier, and that slot is by construction running: the deploy starts the
# target slot and waits for it to become healthy BEFORE rewriting this file, and
# stops the old slot only AFTER the reload succeeded. That ordering is what keeps
# `nginx -t` from ever hitting "host not found in upstream".
#
# Do not hand-edit on the server unless you are recovering manually — the next
# deploy overwrites it. To flip slots by hand:
#   deploy/deploy.sh --switch blue|green
#
# Checked into git with blue as the default so a fresh clone + `up -d` (which
# starts the unprofiled blue slot) serves traffic without running the deploy
# script first.

upstream edllm_backend {
    server backend_blue:8000;
}

upstream edllm_frontend {
    server frontend_blue:3000;
}
