# Production stack for Edllm. SELF-CONTAINED — NOT an override of
# docker-compose.yml. Do not run with `-f docker-compose.yml -f this`: Compose
# MERGES lists (volumes/ports), so a dev bind-mount would silently leak in.
# Code comes ONLY from the built images; there are no source bind-mounts here.
#
#   Build:    docker compose -f docker-compose.prod.yml --env-file .env.prod build
#   Migrate:  docker compose -f docker-compose.prod.yml --env-file .env.prod --profile migrate run --rm migrate
#   Up:       docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#   Validate: docker compose -f docker-compose.prod.yml --env-file .env.prod config
#
# IMAGE_TAG selects the image every app service runs: `edllm-backend:${IMAGE_TAG:-local}`
# / `edllm-frontend:${IMAGE_TAG:-local}`. deploy/deploy.sh exports IMAGE_TAG=<sha>
# and re-points the `:local` tag at the deployed sha when it succeeds, so the
# commands above keep working verbatim with IMAGE_TAG unset.
#
# The web tier is blue-green: backend_blue/backend_green and frontend_blue/
# frontend_green. Exactly one slot serves traffic; nginx picks it up from
# nginx/upstreams/active.conf and switches with `nginx -s reload`, never a
# restart. `blue` is the default slot (no profile), `green` needs
# `--profile green`. See docs/DEPLOYMENT.md §7 and docs/DECISIONS.md §53.
#
# ALWAYS pass `--profile green` alongside `--remove-orphans`. Without it Compose
# can treat the containers of a disabled profile as orphans and delete the LIVE
# green slot. deploy/lib.sh passes the flag on every call for this reason.
#
# App containers run as appuser (uid/gid 1000) — the image's USER, pinned here
# explicitly on every service built from that image. The shared `app_storage`
# volume is seeded from the image's /app/storage, which the Dockerfile chowns to
# appuser, so a freshly created volume is writable by all of them.
#
# UPGRADING AN EXISTING DEPLOYMENT: a volume created back when the containers
# ran as root stays root-owned, and the app can no longer write to it. Run this
# ONCE on the server, before the first `up` on the new images:
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod \
#     run --rm --user root backend_blue chown -R 1000:1000 /app/storage

# ── Reusable fragments (x-* are ignored by Compose; anchors are expanded) ─────
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-extra-hosts: &extra-hosts
  # Lets backend/workers reach a host-side Ollama (host.docker.internal) when
  # the LLM/vision provider is local. Harmless when using a cloud provider.
  - "host.docker.internal:host-gateway"

# Generated files (PPTX/PNG/WAV/MP4 + caches) shared by backend + every worker.
# Mount point matches STORAGE_PATH=/app/storage in .env.prod.
x-app-storage: &app-storage
  - app_storage:/app/storage

x-backend-env: &backend-env
  env_file:
    - .env.prod
  environment:
    ENVIRONMENT: ${ENVIRONMENT:-production}
    APP_VERSION: ${APP_VERSION:-prod}
    SENTRY_DSN: ${SENTRY_DSN:-}
    SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}

# ── Blue-green web slots ─────────────────────────────────────────────────────
# The two slots per tier are identical apart from the container name and the
# `green` profile. Neither publishes a host port — nginx reaches them over
# edu-network and only ever names the ACTIVE one, so a stopped slot can't break
# an `nginx -t`.
#
# The env keys are spelled out here rather than merged from *backend-env on
# purpose: a merge key inside an anchored map that is then itself merged is a
# YAML corner this file should not depend on.
x-backend-web: &backend-web
  image: edllm-backend:${IMAGE_TAG:-local}
  build:
    context: ./backend
    dockerfile: Dockerfile
  user: "1000:1000"
  # gunicorn master + N uvicorn workers, no --reload.
  # --graceful-timeout bounds the drain on SIGTERM: in-flight requests finish,
  # and open SSE streams — which never end on their own — are cut at the
  # deadline, after which the browser reconnects onto the new slot.
  # stop_grace_period MUST stay larger, or Docker SIGKILLs the master mid-drain.
  command: >
    gunicorn app.main:app
    -k uvicorn.workers.UvicornWorker
    --workers ${GUNICORN_WORKERS:-4}
    --bind 0.0.0.0:8000
    --timeout ${GUNICORN_TIMEOUT:-120}
    --graceful-timeout ${GUNICORN_GRACEFUL_TIMEOUT:-45}
    --access-logfile -
    --error-logfile -
  env_file:
    - .env.prod
  environment:
    ENVIRONMENT: ${ENVIRONMENT:-production}
    APP_VERSION: ${APP_VERSION:-prod}
    SENTRY_DSN: ${SENTRY_DSN:-}
    SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
  extra_hosts: *extra-hosts
  volumes: *app-storage
  # interval is short so deploy/deploy.sh's `docker inspect` readiness wait
  # converges in seconds rather than in healthcheck periods.
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health >/dev/null 2>&1 || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 30s
  stop_grace_period: 60s
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  deploy:
    resources:
      limits:
        memory: 2g
  networks:
    - edu-network
  logging: *default-logging

x-frontend-web: &frontend-web
  image: edllm-frontend:${IMAGE_TAG:-local}
  build:
    context: ./frontend
    dockerfile: Dockerfile.prod
  # The SPA needs no backend secrets. apiBase is relative by default (same
  # origin behind nginx); override only if the API ever moves off-domain.
  environment:
    NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-/api/v1}
    # Yandex.Metrika counter id — set in .env.prod (NUXT_PUBLIC_METRIKA_ID=...).
    NUXT_PUBLIC_METRIKA_ID: ${NUXT_PUBLIC_METRIKA_ID:-}
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 20s
  stop_grace_period: 30s
  restart: unless-stopped
  deploy:
    resources:
      limits:
        memory: 512m
  networks:
    - edu-network
  logging: *default-logging

# Per-container liveness for a Celery worker: confirms the broker is reachable
# and a worker replies. (The task spec's canonical check.)
x-celery-healthcheck: &celery-healthcheck
  test: ["CMD-SHELL", "celery -A app.celery_app inspect ping -t 10 >/dev/null 2>&1 || exit 1"]
  interval: 30s
  timeout: 15s
  retries: 5
  start_period: 60s

services:
  postgres:
    image: postgres:17-alpine
    # Only POSTGRES_* — don't dump the whole secret file into this container.
    # Interpolated from --env-file .env.prod.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
    networks:
      - edu-network
    logging: *default-logging

  # Periodic pg_dump → db_backups volume. Single-instance MVP backup: a small
  # loop in the version-matched postgres image (so pg_dump never warns about a
  # server/client mismatch). Custom format (-Fc) → restore with
  #   docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm \
  #     db_backup sh -c 'pg_restore -c -d "$PGDATABASE" /backups/<file>.dump'
  # Retention prunes dumps older than BACKUP_RETENTION_DAYS. An off-host copy
  # (Object Storage) is a post-MVP follow-up; this keeps backups on a volume.
  db_backup:
    image: postgres:17-alpine
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        echo "db_backup: interval=$${BACKUP_INTERVAL_SECONDS}s retention=$${BACKUP_RETENTION_DAYS}d db=$${PGDATABASE}"
        while true; do
          ts=$$(date +%Y%m%d-%H%M%S)
          out="/backups/$${PGDATABASE}-$${ts}.dump"
          if pg_dump -Fc -f "$$out"; then
            echo "db_backup: wrote $$out"
          else
            echo "db_backup: pg_dump FAILED at $$ts" >&2
            rm -f "$$out"
          fi
          find /backups -name "$${PGDATABASE}-*.dump" -type f -mtime +$${BACKUP_RETENTION_DAYS} -delete
          sleep "$${BACKUP_INTERVAL_SECONDS}"
        done
    volumes:
      - db_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - edu-network
    logging: *default-logging

  redis:
    image: redis:8-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env.prod} --appendonly yes
    # Only the password (needed by the healthcheck); not the whole secret file.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - edu-network
    logging: *default-logging

  # ── One-shot migrations. NOT started by `up` (migrate profile). The deploy
  #    script runs this to completion BEFORE rolling out the app; a failed
  #    migration fails the deploy and leaves the running version untouched.
  #    `alembic upgrade head` resolves the URL from settings.DATABASE_URL via
  #    alembic/env.py (async path) — no psycopg2 conversion needed here.
  migrate:
    image: edllm-backend:${IMAGE_TAG:-local}
    build:
      context: ./backend
      dockerfile: Dockerfile
    user: "1000:1000"
    profiles: ["migrate"]
    command: alembic upgrade head
    <<: *backend-env
    extra_hosts: *extra-hosts
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - edu-network
    logging: *default-logging

  # ── Web slots. `blue` carries no profile, so a bare `up -d` (the manual §7
  #    order) brings up a working stack on blue. `green` is opt-in via
  #    `--profile green`, so it never starts by accident and costs no memory
  #    outside the deploy window.
  backend_blue:
    <<: *backend-web
    container_name: edllm-backend-blue

  backend_green:
    <<: *backend-web
    container_name: edllm-backend-green
    profiles: ["green"]

  celery_video:
    image: edllm-backend:${IMAGE_TAG:-local}
    user: "1000:1000"
    command: >
      celery -A app.celery_app worker
      --pool=prefork
      --concurrency=${VIDEO_CONCURRENCY:-2}
      --queues=video
      --hostname=video@%h
      --loglevel=info
    <<: *backend-env
    extra_hosts: *extra-hosts
    volumes: *app-storage
    healthcheck: *celery-healthcheck
    # Give long video tasks time to finish on SIGTERM (Celery warm shutdown).
    stop_grace_period: 120s
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 3g
    networks:
      - edu-network
    logging: *default-logging

  celery_vision:
    image: edllm-backend:${IMAGE_TAG:-local}
    user: "1000:1000"
    command: >
      celery -A app.celery_app worker
      --pool=prefork
      --concurrency=${VISION_TASK_CONCURRENCY:-1}
      --queues=vision
      --hostname=vision@%h
      --loglevel=info
    <<: *backend-env
    extra_hosts: *extra-hosts
    volumes: *app-storage
    healthcheck: *celery-healthcheck
    stop_grace_period: 120s
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g
    networks:
      - edu-network
    logging: *default-logging

  # The ONLY beat in the cluster (--beat). Schedules the daily
  # purge_soft_deleted job. Do NOT add --beat to any other worker or replicate
  # this service, or purge runs twice.
  celery_quiz:
    image: edllm-backend:${IMAGE_TAG:-local}
    user: "1000:1000"
    command: >
      celery -A app.celery_app worker
      --beat
      --schedule=/tmp/celerybeat-schedule
      --pool=prefork
      --concurrency=2
      --queues=quiz
      --hostname=quiz@%h
      --loglevel=info
    <<: *backend-env
    extra_hosts: *extra-hosts
    volumes: *app-storage
    healthcheck: *celery-healthcheck
    stop_grace_period: 30s
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
    networks:
      - edu-network
    logging: *default-logging

  celery_email_worker:
    image: edllm-backend:${IMAGE_TAG:-local}
    user: "1000:1000"
    command: >
      celery -A app.celery_app worker
      --pool=prefork
      --concurrency=2
      --queues=celery_email
      --hostname=email@%h
      --loglevel=info
    <<: *backend-env
    extra_hosts: *extra-hosts
    volumes: *app-storage
    healthcheck: *celery-healthcheck
    stop_grace_period: 30s
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - edu-network
    logging: *default-logging

  frontend_blue:
    <<: *frontend-web
    container_name: edllm-frontend-blue

  frontend_green:
    <<: *frontend-web
    container_name: edllm-frontend-green
    profiles: ["green"]

  nginx:
    image: nginx:1.27-alpine
    # DOMAIN drives server_name + the Let's Encrypt cert path. The official nginx
    # image renders /etc/nginx/templates/*.template → /etc/nginx/conf.d/ via
    # envsubst at startup; NGINX_ENVSUBST_FILTER restricts substitution to
    # ${DOMAIN} so nginx's own $$host / $$remote_addr / etc. runtime vars survive.
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set in .env.prod (e.g. DOMAIN=edllm.ru)}
      NGINX_ENVSUBST_FILTER: "^DOMAIN$$"
    volumes:
      - ./nginx/prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      # The live slot, rewritten by deploy/deploy.sh + `nginx -s reload`. Mounted
      # as a DIRECTORY so the include glob keeps working while the file is
      # replaced on the host.
      - ./nginx/upstreams:/etc/nginx/upstreams:ro
      # Maintenance flag + its 503 page. Also a directory mount: the flag file
      # (deploy/maintenance/ON) does not exist most of the time, and bind-mounting
      # a missing file would make Docker create a directory in its place.
      - ./deploy/maintenance:/etc/nginx/maintenance:ro
      - app_storage:/var/www/storage:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    # No depends_on for the web slots ON PURPOSE. Exactly one of them runs, and
    # naming either here would make `up -d nginx` start a slot that the deploy
    # deliberately stopped. nginx only ever resolves the slot named in
    # nginx/upstreams/active.conf, which by construction is the running one.
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
    networks:
      - edu-network
    logging: *default-logging

  # On-demand only (certbot profile). Issuance: deploy/init-letsencrypt.sh.
  # Renewal + nginx reload hook: deploy/systemd/certbot-renew.{service,timer}.
  certbot:
    image: certbot/certbot:latest
    profiles: ["certbot"]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    networks:
      - edu-network
    logging: *default-logging

  # ── Observability ─────────────────────────────────────────────────────────
  # Ports are NOT published to the host. Prometheus is reachable only inside
  # edu-network (Grafana → prometheus:9090). Grafana and Flower are exposed
  # via nginx TLS at /grafana/ and /flower/ respectively.
  prometheus:
    image: prom/prometheus:latest
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}'
    volumes:
      # Prod-specific: the dev config scrapes `backend:8000`, a service that does
      # not exist here. This one discovers the live slot from targets/*.json,
      # which deploy/deploy.sh rewrites on every switch (file_sd picks the change
      # up by itself — no reload).
      - ./monitoring/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/targets:/etc/prometheus/targets:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    networks:
      - edu-network
    logging: *default-logging

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD must be set in .env.prod}
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:-https://${DOMAIN}/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - edu-network
    logging: *default-logging

  flower:
    image: edllm-backend:${IMAGE_TAG:-local}
    user: "1000:1000"
    command: celery -A app.celery_app flower --port=5555 --url-prefix=/flower
    # Flower imports app.celery_app, so it needs exactly what Settings requires
    # at import time (DATABASE_URL, SECRET_KEY — neither has a default) plus the
    # broker URL. The rest of .env.prod (LLM/vision/TTS/email/YooKassa keys,
    # ADMIN_API_TOKEN, S3 credentials) is unused here and deliberately withheld.
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      APP_VERSION: ${APP_VERSION:-prod}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      FLOWER_BASIC_AUTH: "${CELERY_FLOWER_USER:?CELERY_FLOWER_USER must be set in .env.prod}:${CELERY_FLOWER_PASSWORD:?CELERY_FLOWER_PASSWORD must be set in .env.prod}"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - edu-network
    logging: *default-logging

volumes:
  postgres_data:
  # Timestamped pg_dump archives written by the db_backup sidecar.
  db_backups:
  # Generated PPTX/PNG/WAV/MP4 + caches. Shared RW by backend + all workers,
  # mounted RO into nginx for direct /files/* delivery. Replaces the dev host
  # bind-mount ./backend/storage.
  app_storage:
  # Shared between nginx (RO) and certbot (RW).
  letsencrypt:
  certbot_webroot:
  prometheus_data:
  grafana_data:
  redis_data:

networks:
  edu-network:
    driver: bridge
